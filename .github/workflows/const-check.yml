name: const check

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  analyze:
    name: flutter analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - run: flutter analyze --no-fatal-warnings --no-fatal-infos
